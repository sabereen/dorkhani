<!doctype html>
<html lang="fa" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f7f5ef" />
		<title>آفلاین | دورخوانی</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: Tahoma, Arial, sans-serif;
				background: #f7f5ef;
				color: #18231f;
			}

			body {
				display: flex;
				min-height: 100vh;
				align-items: center;
				justify-content: center;
				box-sizing: border-box;
				margin: 0;
				padding: 1.25rem;
				background: #f7f5ef;
			}

			main {
				width: 100%;
				max-width: 30rem;
				box-sizing: border-box;
				padding: 2rem;
				border: 1px solid #d8d5c9;
				border-radius: 1.5rem;
				background: #fffdfa;
				box-shadow: 0 24px 64px rgba(24, 35, 31, 0.13);
				text-align: center;
			}

			img {
				width: 5rem;
				height: 5rem;
				border-radius: 1.125rem;
			}

			h1 {
				margin: 1.25rem 0 0;
				font-size: 1.5rem;
			}

			p {
				margin: 0.75rem 0 0;
				color: #617168;
				line-height: 1.9;
			}

			a {
				display: inline-block;
				margin-top: 1.5rem;
				padding: 0.75rem 1.25rem;
				border-radius: 0.75rem;
				background: #176b55;
				color: #fffdfa;
				font-weight: 700;
				text-decoration: none;
			}

			a:hover {
				background: #105643;
			}

			a:focus {
				outline: 3px solid rgba(23, 107, 85, 0.32);
				outline-offset: 3px;
			}

			@media (prefers-color-scheme: dark) {
				:root,
				body {
					background: #07110f;
					color: #eff8f3;
				}

				main {
					border-color: #28443b;
					background: #0d1b18;
					box-shadow: 0 28px 72px rgba(0, 0, 0, 0.42);
				}

				p {
					color: #a7bcb2;
				}

				a {
					background: #55c8a0;
					color: #061712;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<img src="./icon-192.png" alt="" width="80" height="80" />
			<h1>اتصال اینترنت برقرار نیست</h1>
			<p>
				فایل‌های اصلی برنامه آماده‌اند، اما دیدن اطلاعات به‌روز ختم‌ها به اتصال نیاز دارد.
			</p>
			<a href="">تلاش دوباره</a>
			<a class="offline-khatm-link" href="./offline-khatm">ورود به ختم آفلاین</a>
		</main>
	</body>
</html>
