  viewBox="0 0 512 512"
  width="512"
  height="512"
  preserveAspectRatio="xMidYMid meet"
>
  <g fill="currentColor">

    <!-- 8 identical ornamental arms -->
    <g id="juz-arm">
      <path d="
        M256 34
        C244 58 232 77 216 94
        C228 101 240 108 256 120
        C272 108 284 101 296 94
        C280 77 268 58 256 34
        Z
      "/>

      <path d="
        M256 103
        C243 124 235 145 235 168
        C235 184 242 201 256 220
        C270 201 277 184 277 168
        C277 145 269 124 256 103
        Z
      "/>
    </g>

    <use href="#juz-arm"/>
    <use href="#juz-arm" transform="rotate(45 256 256)"/>
    <use href="#juz-arm" transform="rotate(90 256 256)"/>
    <use href="#juz-arm" transform="rotate(135 256 256)"/>
    <use href="#juz-arm" transform="rotate(180 256 256)"/>
    <use href="#juz-arm" transform="rotate(225 256 256)"/>
    <use href="#juz-arm" transform="rotate(270 256 256)"/>
    <use href="#juz-arm" transform="rotate(315 256 256)"/>

    <!-- outer ornamental ring -->
    <path
