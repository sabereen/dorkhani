        M256 138
        C321 138 374 191 374 256
        C374 321 321 374 256 374
        C191 374 138 321 138 256
        C138 191 191 138 256 138
        Z

        M256 166
        C206 166 166 206 166 256
        C166 306 206 346 256 346
        C306 346 346 306 346 256
        C346 206 306 166 256 166
        Z
      "
    />

    <!-- central eight-point motif -->
    <path d="
      M256 181
      L274 220
      L315 197
      L292 238
      L331 256
      L292 274
      L315 315
      L274 292
      L256 331
      L238 292
      L197 315
      L220 274
      L181 256
      L220 238
      L197 197
      L238 220
      Z
    "/>

    <!-- central opening -->
    <circle cx="256" cy="256" r="36"/>

  </g>
</svg>
