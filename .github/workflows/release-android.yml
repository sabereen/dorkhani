name: Release Android APK

on:
  push:
    tags:
      - 'android-v*'
    branches:
      - 'release/android-v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    environment: android

    env:
      PUBLIC_SERVER_ORIGIN: https://dorkhani.ir
      PUBLIC_FONT_PROXY: '0'
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive Android version from ref
        id: version
        shell: bash
        run: |
          set -euo pipefail

          ref_name="$GITHUB_REF_NAME"
          if [[ "$ref_name" == release/android-v* ]]; then
            ref_name="android-v${ref_name#release/android-v}"
          fi

          if [[ "$ref_name" != android-v* ]]; then
            echo 'Invalid release ref.' >&2
            exit 1
          fi

          tag="${ref_name#android-v}"

          if [[ "$tag" =~ ^([0-9]{1,4})\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            channel=99
            prerelease=false
          elif [[ "$tag" =~ ^([0-9]{1,4})\.([0-9]{1,2})\.([0-9]{1,2})-beta\.([0-9])$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            beta="${BASH_REMATCH[4]}"
            channel=$((10#$beta + 1))
            prerelease=true
          else
            echo 'Invalid tag.' >&2
            echo 'Use android-v<major>.<minor>.<patch> or android-v<major>.<minor>.<patch>-beta.<0-9>.' >&2
            exit 1
          fi

          version_code=$((
            10#$major * 1000000 +
            10#$minor * 10000 +
            10#$patch * 100 +
            channel
          ))

          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Calculated Android versionCode is invalid: $version_code" >&2
            exit 1
          fi

          release_ref="android-v$tag"
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "tag=$release_ref" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          echo "Android versionName: $tag"
          echo "Android versionCode: $version_code"
          echo "Prerelease: $prerelease"

      - name: Move release tag to this commit
        if: startsWith(github.ref_name, 'release/android-v')
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin "$GITHUB_SHA:refs/tags/$RELEASE_TAG"

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_BASE64" ||
                -z "$ANDROID_KEYSTORE_PASSWORD" ||
                -z "$ANDROID_KEY_ALIAS" ||
                -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo 'Configure all Android signing secrets before creating a release.' >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/release.keystore"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          if [[ ! -s "$keystore_path" ]]; then
            echo 'Decoded Android keystore is empty.' >&2
            exit 1
          fi

          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build Capacitor web assets and sync Android
        shell: bash
        run: |
          set -euo pipefail
          pnpm android:sync

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x android/gradlew

      - name: Build signed release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease \
            -PversionName='${{ steps.version.outputs.name }}' \
            -PversionCode='${{ steps.version.outputs.code }}'

      - name: Prepare release artifact
        id: artifact
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail

          source_apk="android/app/build/outputs/apk/release/app-release.apk"
          artifact_dir="$RUNNER_TEMP/android-release"
          artifact_apk="$artifact_dir/quran-khatm-$VERSION_NAME.apk"

          if [[ ! -f "$source_apk" ]]; then
            echo "Release APK was not created at: $source_apk" >&2
            exit 1
          fi

          mkdir -p "$artifact_dir"
          cp "$source_apk" "$artifact_apk"

          if [[ ! -s "$artifact_apk" ]]; then
            echo 'Prepared release APK is empty.' >&2
            exit 1
          fi

          echo "apk=$artifact_apk" >> "$GITHUB_OUTPUT"

          echo "Prepared release APK:"
          ls -lh "$artifact_apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          APK_PATH: ${{ steps.artifact.outputs.apk }}
        shell: bash
        run: |
          set -euo pipefail

          release_args=(
            --title "Android $VERSION_NAME"
            --generate-notes
          )

          if [[ "$IS_PRERELEASE" == 'true' ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; replacing APK asset."
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$APK_PATH" \
              "${release_args[@]}"
          fi
