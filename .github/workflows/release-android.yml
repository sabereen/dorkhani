name: Release Android APK

on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    environment: android

    env:
      PUBLIC_SERVER_ORIGIN: https://dorkhani.ir
      PUBLIC_FONT_PROXY: 0
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive Android version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME#android-v}"

          if [[ ! "$tag" =~ ^([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})(-beta\.([0-9]))?$ ]]; then
            echo 'Tag must be android-v<major>.<minor>.<patch> or android-v<major>.<minor>.<patch>-beta.<0-9>.' >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          beta="${BASH_REMATCH[5]:-0}"

          version_code=$(
            (
              10#$major * 100000 +
              10#$minor * 1000 +
              10#$patch * 10 +
              10#$beta
            )
          )

          if (( version_code > 2147483647 )); then
            echo 'The calculated Android version code exceeds the supported maximum.' >&2
            exit 1
          fi

          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "beta=$beta" >> "$GITHUB_OUTPUT"

          echo "Android version name: $tag"
          echo "Android version code: $version_code"

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_BASE64" ||
                -z "$ANDROID_KEYSTORE_PASSWORD" ||
                -z "$ANDROID_KEY_ALIAS" ||
                -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo 'Configure all Android signing secrets before creating a release.' >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/release.keystore"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$keystore_path"

          chmod 600 "$keystore_path"

          if [[ ! -s "$keystore_path" ]]; then
            echo 'Decoded Android keystore is empty.' >&2
            exit 1
          fi

          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build Capacitor web assets and sync Android
        shell: bash
        run: |
          set -euo pipefail
          pnpm android:sync

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x android/gradlew

      - name: Build signed release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease \
            -PversionName='${{ steps.version.outputs.name }}' \
            -PversionCode='${{ steps.version.outputs.code }}'

      - name: Verify release APK exists
        shell: bash
        run: |
          set -euo pipefail

          apk="android/app/build/outputs/apk/release/app-release.apk"

          if [[ ! -f "$apk" ]]; then
            echo "Release APK was not created at: $apk" >&2
            exit 1
          fi

          echo "Release APK:"
          ls -lh "$apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          IS_BETA: ${{ steps.version.outputs.beta }}
        shell: bash
        run: |
          set -euo pipefail

          apk="android/app/build/outputs/apk/release/app-release.apk"
          release_args=()

          if [[ "$IS_BETA" != '0' ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            "$apk#quran-khatm-$VERSION_NAME.apk" \
            --title "Android $VERSION_NAME" \
            --generate-notes \
            "${release_args[@]}"
