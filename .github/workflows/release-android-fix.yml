name: Release Android APK (tag recovery)

on:
  push:
    branches:
      - 'android-v*'

permissions:
  contents: write

jobs:
  release:
    name: Retag and dispatch Android release
    runs-on: ubuntu-latest

    steps:
      - name: Check out corrected source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Move release tag to corrected commit and dispatch real release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin "$GITHUB_SHA:refs/tags/$RELEASE_TAG"
          gh workflow run release-android.yml --ref "refs/tags/$RELEASE_TAG"
          echo "Dispatched release-android.yml for $RELEASE_TAG"
